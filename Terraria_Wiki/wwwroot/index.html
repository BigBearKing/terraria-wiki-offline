<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>Terraria Wiki</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Terraria_Wiki.styles.css" />
    <link rel="icon" href="data:,">
    <!-- Iframe 通信桥接库 -->
    <script src="js/iframe-bridge.js"></script>
    <script>
        // hostBridge 已由 iframe-bridge.js 提供
        // 添加获取 iframe 当前位置的便捷函数
        window.getCurrentIframePosition = async function () {
            try {
                const position = await window.hostBridge.getIframeScrollPosition();
                return position.toString();
            } catch (error) {
                console.error('获取 iframe 位置失败:', error);
                return "0";
            }
        };

        window.checkTheme = function () {
            return document.documentElement.classList.contains('dark-theme');
        };

        window.initTheme = function (isDark) {
            if (isDark === "True") {
                document.documentElement.classList.add('dark-theme');
            } else {
                document.documentElement.classList.remove('dark-theme');
            }
        };

        window.initHover = function (hasHover) {
            if (hasHover === "True") {
                document.body.classList.add('has-hover');
            } else {
                document.body.classList.remove('has-hover');
            }

        };


        window.initGlobalScreenListener = () => {
            const mq = window.matchMedia('(max-width: 768px)');

            // 定义一个统一的通知函数
            const sendUpdate = (isSmall) => {
                DotNet.invokeMethodAsync('Terraria_Wiki', 'OnScreenChanged', isSmall);
            };

            // 监听变化事件
            mq.addEventListener('change', (e) => {
                sendUpdate(e.matches);
            });

            // 【核心修正】初始化时立刻手动执行一次！
            // 确保 C# 在启动瞬间就能拿到状态
            sendUpdate(mq.matches);
        };

        window.setSafeAreaTop = (top) => {
            document.documentElement.style.setProperty('--safe-area-top', top + 'px');
        };
        window.setSafeAreaBottom = (bottom) => {
            document.documentElement.style.setProperty('--safe-area-bottom', bottom + 'px');
        };
        window.setSafeAreaLeft = (left) => {
            document.documentElement.style.setProperty('--safe-area-left', left + 'px');
        };
        window.setSafeAreaRight = (right) => {
            document.documentElement.style.setProperty('--safe-area-right', right + 'px');
        };
        window.setGlobalKeyboardHeight = (height) => {
            document.documentElement.style.setProperty('--global-keyboard-offset', height + 'px');
        };


    </script>
</head>

<body>

    <div id="app">

    </div>


    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        const pendingCsharpCalls = {};

        window.toggleTheme = function (savedContentTheme) {
            document.documentElement.classList.add('is-switching-theme');

            const isDark = document.documentElement.classList.toggle('dark-theme');
            if (savedContentTheme === "auto") {
                if (isDark) {
                    hostBridge.sendToIframe({ type: "req", id: '999', method: "ChangeTheme", data: 'True' });
                } else {
                    hostBridge.sendToIframe({ type: "req", id: '999', method: "ChangeTheme", data: 'False' });
                }
            }


            setTimeout(() => {
                document.documentElement.classList.remove('is-switching-theme');
            }, 350);

            // 4. 最后再返回结果给 C#
            return isDark;
        };

        // 鼠标/手指按下时，给 body 加上标记
        document.addEventListener('pointerdown', function (e) {
            document.body.classList.add('is-mouse-down');
        }, { passive: true });

        // 拦截按下事件，阻止 WebView 的默认导航行为
        document.addEventListener('pointerup', function (e) {
            // e.button === 3 是侧键后退，e.button === 4 是侧键前进
            if (e.button === 3 || e.button === 4) {
                e.preventDefault();
            }
            document.body.classList.remove('is-mouse-down');

        });

        // ===== 窗口拖拽区域：与 tauri 的 data-tauri-drag-region (drag.js) 实现对齐 =====
        // 属性语义：bare/"true"=仅自身；"deep"=子树任意点击；"false"=禁用(阻断祖先拖拽)
        // 可点击元素(button/a/input 等)默认阻断拖拽，除非它们自身带该属性
        (function () {
            const TAURI_DRAG_REGION_ATTR = 'data-tauri-drag-region';
            const CLICKABLE_TAGS = new Set(['A', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'LABEL', 'SUMMARY']);
            const INTERACTIVE_ROLES = new Set(['button', 'link', 'menuitem', 'tab', 'checkbox', 'radio', 'switch', 'option']);

            function isClickableElement(el) {
                return CLICKABLE_TAGS.has(el.tagName)
                    || (el.hasAttribute('contenteditable') && el.getAttribute('contenteditable') !== 'false')
                    || (el.hasAttribute('tabindex') && el.getAttribute('tabindex') !== '-1')
                    || INTERACTIVE_ROLES.has(el.getAttribute('role'));
            }

            // 与 tauri 的 isDragRegion 完全一致：沿 composedPath 从目标向上遍历
            function isDragRegion(composedPath) {
                for (const el of composedPath) {
                    if (!(el instanceof HTMLElement)) continue;
                    const attr = el.getAttribute(TAURI_DRAG_REGION_ATTR);
                    // 可点击且无显式拖拽属性 → 阻断拖拽
                    if (isClickableElement(el) && attr === null) return false;
                    if (attr === null) continue;
                    if (attr === 'false') return false;
                    if (attr === 'deep') return true;
                    if (attr === '' || attr === 'true') return el === composedPath[0];
                }
                return false;
            }

            // 平台判断（tauri 通过模板注入 os_name，这里用 userAgent 等价判断）
            const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform) || navigator.userAgent.includes('Mac');

            // 同步调用桥：优先走 WebView2 host objects（window.chrome.webview.hostObjects.sync），
            // 它是原生同步通道，不经过 Blazor JS interop 的异步消息队列，
            // 避免 mousedown 期间消息被 WebView2 输入处理推迟，导致拖拽命令晚于 mouseup 执行
            // （表现为：拖动时窗口不动、松开瞬间才跳到鼠标位置）。
            function invokeDragCommand(cmd) {
                try {
                    var host = window.chrome && window.chrome.webview && window.chrome.webview.hostObjects
                        && window.chrome.webview.hostObjects.sync
                        && window.chrome.webview.hostObjects.sync.dragBridge;
                    if (host) {
                        host[cmd]();
                        return;
                    }
                } catch (err) { }
            }

            let isDragStarted = false;
            let initialX = 0;
            let initialY = 0;

            // 捕获阶段同步处理 mousedown，赶在 mouseup 之前把拖拽命令发出去，
            // 避免 Blazor 事件桥的异步延迟导致"松开才跳"
            document.addEventListener('mousedown', function (e) {
                if (e.button !== 0) return;
                if (e.detail !== 1 && e.detail !== 2) return;
                if (!isDragRegion(e.composedPath())) return;

                // 与 tauri 一致：防止文本光标
                e.preventDefault();
                // 与 tauri 一致：阻止其他 mousedown 处理（修复双击拖拽区边缘误触发最大化）
                e.stopImmediatePropagation();

                // macOS 最大化在 mouseup 触发，先保存状态并返回
                if (isMac && e.detail === 2) {
                    initialX = e.clientX;
                    initialY = e.clientY;
                    return;
                }

                const cmd = e.detail === 2 ? 'ToggleMaximize' : 'StartWindowDrag';
                invokeDragCommand(cmd);
            }, true);

            // macOS：双击最大化在 mouseup 且鼠标未移动时触发（与系统原生行为一致）
            if (isMac) {
                document.addEventListener('mouseup', function (e) {
                    if (e.button !== 0 || e.detail !== 2) return;
                    if (e.clientX === initialX && e.clientY === initialY
                        && isDragRegion(e.composedPath())) {
                        invokeDragCommand('ToggleMaximize');
                    }
                }, true);
            }
        })();


        //拦截默认浏览器行为
        window.disableBrowserShortcuts = function () {
            // 使用 capture: true 在捕获阶段拦截事件，防止其他脚本阻断
            window.addEventListener('keydown', function (e) {
                // 需要禁用的独立按键 (可以根据需求增删)
                const blockKeys = ['F5', 'F12', 'F11'];
                // 需要禁用的 Ctrl/Cmd 组合键 (f:查找, r:刷新, p:打印, s:保存)
                const blockCtrlKeys = ['f', 'r', 'p', 's'];

                // 拦截独立按键
                if (blockKeys.includes(e.key)) {
                    e.preventDefault();
                    return;
                }

                // 拦截组合键 (e.metaKey 是为了兼容 Mac 的 Cmd 键)
                if ((e.ctrlKey || e.metaKey) && blockCtrlKeys.includes(e.key.toLowerCase())) {
                    e.preventDefault();
                    return;
                }
            }, { capture: true });
        };

        window.scrollToBottomImmediate = (elementId) => {
            var element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            } else {
            }
        };

        window.scrollToBottom = (elementId) => {
            var element = document.getElementById(elementId);
            if (!element) return;

            // 1. 计算当前距离底部的像素值
            // 公式：总高度 - (卷去的高度 + 可视窗口高度)
            var distanceToBottom = element.scrollHeight - element.scrollTop - element.clientHeight;

            var threshold = 100;

            // 3. 只有当用户“就在底部附近”时，才自动滚动
            if (distanceToBottom < threshold) {

                // 立即滚动
                element.scrollTop = element.scrollHeight;

                // 针对 Virtualize 的延迟再次滚动 (防止 DOM 还没画完)
                window.requestAnimationFrame(() => {
                    element.scrollTop = element.scrollHeight;
                    setTimeout(() => {
                        element.scrollTop = element.scrollHeight;
                    }, 50);
                });
            }
        }

        // 全局状态管理，防止同一个面板被多次挂载管理器
        window.swipeManagers = window.swipeManagers || {};

        // 【第一层】专门负责监听屏幕尺寸，并决定什么时候挂载/卸载拖拽事件
        window.setupResponsiveSwipe = function (elementId) {
            // 防止重复初始化同一个元素
            if (window.swipeManagers[elementId]) return;

            const mediaQuery = window.matchMedia('(max-width: 768px)');
            let cleanupSwipeFn = null; // 用于保存卸载拖拽事件的函数
            let isSwipeInitialized = false; // 状态标记：当前是否挂载了事件

            // 核心判断逻辑
            const checkAndToggle = () => {
                const panel = document.getElementById(elementId);
                const isSmallScreen = mediaQuery.matches;

                // 💡 满足你的要求：屏幕 < 768 且 panel 存在 且 当前未挂载
                if (isSmallScreen && panel && !isSwipeInitialized) {
                    cleanupSwipeFn = initSwipeLogic(panel);
                    isSwipeInitialized = true;
                }
                // 如果屏幕变大，且当前已经挂载了事件
                else if (!isSmallScreen && isSwipeInitialized) {
                    if (cleanupSwipeFn) {
                        cleanupSwipeFn(); // 执行卸载
                        cleanupSwipeFn = null;
                    }
                    isSwipeInitialized = false;
                }
            };

            // 1. 刚打开网页时先检测一次
            checkAndToggle();

            // 2. 监听屏幕拉伸事件
            mediaQuery.addEventListener('change', checkAndToggle);

            // 存入全局，方便 Blazor 在组件销毁时调用彻底清理内存
            window.swipeManagers[elementId] = {
                dispose: () => {
                    mediaQuery.removeEventListener('change', checkAndToggle);
                    if (cleanupSwipeFn) cleanupSwipeFn();
                    delete window.swipeManagers[elementId];
                }
            };
        };


        // 【第二层】纯粹的拖拽核心逻辑，不关心屏幕有多大
        function initSwipeLogic(panel) {
            let startY = 0, currentY = 0, isDragging = false;

            const handlePointerDown = (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                // 💡 重点新增：检查点击的目标元素
                // 如果点击的是带有 'no-swipe' class 的元素，或者它的任何子元素，直接拦截
                if (e.target.closest('.no-swipe')) {
                    return; // 退出函数，不启动拖拽
                }

                isDragging = true;
                startY = e.clientY;
                currentY = startY;

                panel.style.transition = 'none';
                panel.setPointerCapture(e.pointerId);

                document.addEventListener('pointermove', handlePointerMove);
                document.addEventListener('pointerup', handlePointerUpOrCancel);
                document.addEventListener('pointercancel', handlePointerUpOrCancel);
                window.addEventListener('blur', handlePointerUpOrCancel);
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                currentY = e.clientY;
                let deltaY = currentY - startY;
                if (deltaY < 0) deltaY = 0;
                panel.style.transform = `translateY(${deltaY}px)`;
            };

            const handlePointerUpOrCancel = (e) => {
                if (!isDragging) return;
                isDragging = false;
                try { panel.releasePointerCapture(e.pointerId); } catch (err) { }

                // 清理临时事件
                document.removeEventListener('pointermove', handlePointerMove);
                document.removeEventListener('pointerup', handlePointerUpOrCancel);
                document.removeEventListener('pointercancel', handlePointerUpOrCancel);
                window.removeEventListener('blur', handlePointerUpOrCancel);

                panel.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
                const deltaY = currentY - startY;
                const visibleHeight = window.innerHeight - panel.getBoundingClientRect().top;

                if (deltaY > 150 || visibleHeight < 100) {
                    panel.style.transform = `translateY(100%)`;

                    // 通知 C# 销毁
                    setTimeout(() => {
                        DotNet.invokeMethodAsync('Terraria_Wiki', 'CloseLogPanel');
                    }, 300);
                } else {
                    panel.style.transform = `translateY(0)`;
                }
            };

            // 绑定基础事件
            panel.addEventListener('pointerdown', handlePointerDown);

            return function cleanup() {
                panel.removeEventListener('pointerdown', handlePointerDown);
                document.removeEventListener('pointermove', handlePointerMove);
                document.removeEventListener('pointerup', handlePointerUpOrCancel);
                document.removeEventListener('pointercancel', handlePointerUpOrCancel);
                window.removeEventListener('blur', handlePointerUpOrCancel);
                panel.style.transform = '';
            };
        }

        //iOS防烧屏配置
        {
            // 1. 判断系统
            function checkIsIOS() {
                const userAgent = window.navigator.userAgent.toLowerCase();
                if (/iphone|ipod|ipad/.test(userAgent)) return true;
                if (userAgent.includes('mac') && navigator.maxTouchPoints && navigator.maxTouchPoints > 2) return true;
                return false;
            }

            let debounceTimer;

            const notifyInteraction = () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    DotNet.invokeMethodAsync('Terraria_Wiki', 'NotifyInteraction').catch(e => { });
                }, 1000);
            };

            // 独立出 iframe 消息处理函数，方便后续移除监听
            const handleIframeMessage = (e) => {
                if (e.data === 'iframe_user_active') {
                    notifyInteraction(); // 收到 iframe 的汇报，重置 C# 计时器
                }
            };

            window.startBurnInMonitoring = () => {
                if (!checkIsIOS()) return;

                // 1. 开启外层自身的监听
                window.addEventListener('pointerdown', notifyInteraction);
                window.addEventListener('pointermove', notifyInteraction);
                window.addEventListener('keydown', notifyInteraction);
                window.addEventListener('scroll', notifyInteraction, true);

                // 2. 监听来自 iframe 的汇报
                window.addEventListener('message', handleIframeMessage);

                // 3. 找到 iframe 并向它下发“开始监听”的命令
                const iframe = document.querySelector('iframe'); // 如果你有多个 iframe，建议加上 id 选择器，如 '#wiki-iframe'
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage('start_iframe_monitor', '*');
                }
            };

            window.stopBurnInMonitoring = () => {
                if (!checkIsIOS()) return;

                // 1. 卸载外层自身的监听
                window.removeEventListener('pointerdown', notifyInteraction);
                window.removeEventListener('pointermove', notifyInteraction);
                window.removeEventListener('keydown', notifyInteraction);
                window.removeEventListener('scroll', notifyInteraction, true);

                // 2. 卸载 iframe 消息的监听
                window.removeEventListener('message', handleIframeMessage);
                clearTimeout(debounceTimer);

                // 3. 💡 找到 iframe 并向它下发“停止监听”的命令
                const iframe = document.querySelector('iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage('stop_iframe_monitor', '*');
                }
            };
        }

    </script>

</body>
</html>
